server {
    listen 80;
    server_name pavel.test;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name pavel.test;

    ssl_certificate     /etc/ssl/certs/pavel.test.crt;
    ssl_certificate_key /etc/ssl/private/pavel.test.key;

    root /var/www/homelab;
    index index.html;
    charset utf-8;

    access_log /var/log/nginx/homelab.access.log;
    error_log  /var/log/nginx/homelab.error.log;

    location / {
        try_files $uri $uri/ =404;
    }
}
